<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConstructionOS — Emergency Recovery Mode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #111111; color: #f5f5f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1b1b1b; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 32px; max-width: 540px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; background: rgba(199,154,85,0.15); color: #c79a55; font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; border: 1px solid rgba(199,154,85,0.3); }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #ffffff; }
    p { font-size: 14px; line-height: 1.6; color: #a6a6a0; margin-bottom: 24px; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    button, a.btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; text-decoration: none; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #c79a55, #e6b975); color: #000; box-shadow: 0 4px 15px rgba(199,154,85,0.25); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: #262626; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
    .btn-secondary:hover { background: #333; }
    .status { margin-top: 20px; padding: 12px; border-radius: 10px; background: #111; border: 1px solid rgba(255,255,255,0.05); font-size: 12px; font-family: monospace; color: #86b890; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Standalone Emergency Recovery</div>
    <h1>Platform Self-Healing Engine</h1>
    <p>This static recovery gateway enables you to clear cached sessions, unregister stale service workers, and force a fresh fetch of the latest platform build.</p>

    <div class="btn-group">
      <button class="btn-primary" onclick="healAndReload()">⚡ Run Auto-Heal & Launch App</button>
      <a href="./" class="btn btn-secondary">Direct App Entry</a>
    </div>

    <div class="status" id="statusBox">
      ✓ Standalone recovery harness ready.
    </div>
  </div>

  <script>
    function healAndReload() {
      var box = document.getElementById('statusBox');
      box.innerText = '⟳ Purging local caches and service workers...';
      try {
        localStorage.clear();
        sessionStorage.clear();
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (let name of names) caches.delete(name);
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (let reg of regs) reg.unregister();
          });
        }
        setTimeout(function() {
          box.innerText = '✓ Caches purged. Redirecting to application...';
          window.location.href = './';
        }, 800);
      } catch (e) {
        window.location.href = './';
      }
    }
  </script>
</body>
</html>
